[project]
name = "skilldrill-backend"
version = "0.2.0"
description = "Local-first MCQ and scenario-based technical interview practice engine"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.4",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
    "httpx>=0.27",
    "numpy>=2.0",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.7",
    "black>=24.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # Depends(...) in argument defaults is the correct FastAPI idiom

[tool.ruff.lint.per-file-ignores]
"llm/prompts.py" = ["E501"]  # long lines are natural-language prompt text
"*/migrations/*.py" = ["E501"]  # generated code

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
python_files = ["test_*.py"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quizbank*", "api*", "llm*", "config*"]
